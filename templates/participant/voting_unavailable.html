{% extends "participant/base.html" %}

{% block title %}Votação indisponível — Uma Voting{% endblock %}

{% block content %}
  <section class="unavailable-state" aria-labelledby="unavailable-title">
    <p class="text-muted text-small">Votação</p>
    <h1 id="unavailable-title">{{ voting.title }}</h1>

    <div class="alert alert-danger" role="alert">{{ message }}</div>

    <p class="text-muted">
      O voto não foi registrado. Volte às votações para consultar as opções disponíveis.
    </p>

    <a class="btn btn-primary" href="{% url 'participant:home' %}">Voltar às votações</a>
  </section>
{% endblock %}
