# Produção: TLS obrigatório, cookies seguros e rotação de logs do Docker.
services:
  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  release:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"

  scheduler:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
