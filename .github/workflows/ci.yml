name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-secret-key-apenas-para-testes-com-mais-de-50-caracteres-0000000000
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000

jobs:
  quality:
    name: Lint, migrações e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: uma_voting
          POSTGRES_USER: uma_voting
          POSTGRES_PASSWORD: uma_voting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uma_voting -d uma_voting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Auditoria de dependências
        run: uv run --with pip-audit==2.10.1 pip-audit

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Verificar migrações pendentes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Testes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run pytest

  deploy-check:
    name: check --deploy
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Check de produção
        run: uv run python manage.py check --deploy --fail-level WARNING

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: uma-voting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Railway
    needs: [quality, deploy-check, docker]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'JoaoVanzuita/Uma-Voting'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuração de deploy
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "::error::Defina o secret RAILWAY_TOKEN (project token) no Environment production."; exit 1; }
          test -n "${{ vars.RAILWAY_SERVICE }}" || { echo "::error::Defina a variable RAILWAY_SERVICE."; exit 1; }

      - name: Instalar Railway CLI
        run: npm install --global "@railway/cli@${{ vars.RAILWAY_CLI_VERSION || '5.75.0' }}"

      - name: Deploy do commit (aguarda SUCCESS)
        # O serviço tem fonte GitHub, então `railway up` (upload) não se aplica:
        # o deploy é disparado pelo commit que já passou pelo CI. `--json` sai
        # com código diferente de zero quando o deploy falha ou expira.
        run: |
          railway redeploy \
            --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment "${{ vars.RAILWAY_ENVIRONMENT }}" \
            --service "${{ vars.RAILWAY_SERVICE }}" \
            --commit "$GITHUB_SHA" \
            --yes \
            --json

      - name: Smoke test
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          test -n "$APP_BASE_URL" || { echo "::error::Defina a variable APP_BASE_URL."; exit 1; }
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "$APP_BASE_URL/health/" | grep -q '"status": *"ok"'
