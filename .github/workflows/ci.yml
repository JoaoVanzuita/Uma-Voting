name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-secret-key-apenas-para-testes-com-mais-de-50-caracteres-0000000000
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
  DATABASE_URL: postgres://uma_voting:uma_voting@localhost:5432/uma_voting

jobs:
  quality:
    name: Lint, migrações e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: uma_voting
          POSTGRES_USER: uma_voting
          POSTGRES_PASSWORD: uma_voting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uma_voting -d uma_voting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Auditoria de dependências
        run: uv run --with pip-audit pip-audit

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Verificar migrações pendentes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Testes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run pytest

  deploy-check:
    name: check --deploy
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_SSL_REDIRECT: "True"
      DJANGO_SESSION_COOKIE_SECURE: "True"
      DJANGO_CSRF_COOKIE_SECURE: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --frozen

      - name: Check de produção
        run: uv run python manage.py check --deploy --fail-level WARNING

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: uma-voting:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
