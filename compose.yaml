name: uma-voting

x-app: &app
  build:
    context: .
    target: runtime
  image: uma-voting:latest
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  restart: unless-stopped

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uma_voting}
      POSTGRES_USER: ${POSTGRES_USER:-uma_voting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uma_voting}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  release:
    <<: *app
    restart: "no"
    command: ["sh", "scripts/release.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  web:
    <<: *app
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  scheduler:
    <<: *app
    command: ["python", "manage.py", "run_scheduler", "--interval", "60"]
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  import-worker:
    <<: *app
    command: ["python", "manage.py", "run_import_worker", "--interval", "5"]
    depends_on:
      db:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
